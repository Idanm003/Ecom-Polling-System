spring:
  application:
    name: PollingSystem

  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

  server:
  port: 8080

  poll:
    tables:
      users: users
      questions: questions
      user_answers: user_answers
